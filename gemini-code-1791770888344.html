<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BWHS - Binge Watch Humble Streams</title>
  <meta name="description" content="What To Watch?! Explore and discover top movies, shows, anime, and cartoons." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://image.tmdb.org" />
  <link rel="preconnect" href="https://api.themoviedb.org" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --accent: #f59e0b;
      --accent-pink: #ec4899;
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #f1f5f9;
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.06);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 30px; }

    header { background: var(--surface); position: sticky; top: 0; z-index: 50; box-shadow: var(--shadow-sm); border-bottom: 1px solid var(--border); }
    .header-inner { max-width: 600px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
    .brand-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .brand-logo img { width: 34px; height: 34px; object-fit: contain; }
    .brand-title { font-size: 1.1rem; font-weight: 800; color: var(--text-main); }
    .brand-subtitle { font-size: 0.58rem; font-weight: 700; color: var(--primary); text-transform: uppercase; }
    .header-tagline { font-size: 0.75rem; font-weight: 800; color: var(--accent-pink); background: rgba(236, 72, 153, 0.1); padding: 4px 10px; border-radius: 9999px; }

    main { max-width: 600px; margin: 0 auto; padding: 16px; width: 100%; flex: 1; display: flex; flex-direction: column; gap: 16px; }

    /* Control Suite Panel */
    .control-panel {
      background: var(--surface);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid var(--border);
    }
    .filters-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .filter-group label {
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .filter-group select {
      background: var(--surface-subtle);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    /* Results Section & Compact Action Area */
    .results-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    /* Mobile-Optimized Grid (3 columns) */
    .media-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; min-height: 10px;
    }
    .media-card {
      background: var(--surface); border-radius: 12px; overflow: hidden; display: flex;
      flex-direction: column; cursor: pointer; box-shadow: var(--shadow-sm); border: 1px solid var(--border);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .media-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .poster-wrap { position: relative; width: 100%; aspect-ratio: 2 / 3; background: #000; overflow: hidden; }
    .poster-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .badge-pill {
      position: absolute; top: 6px; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
      color: #fff; padding: 2px 5px; border-radius: 4px; font-size: 0.6rem; font-weight: 700;
    }
    .badge-pill.rating { right: 6px; color: #fbbf24; display: flex; align-items: center; gap: 2px; }
    .badge-pill.year { left: 6px; }

    .card-body { padding: 8px; display: flex; flex-direction: column; justify-content: space-between; flex: 1; gap: 2px; }
    .card-title {
      font-size: 0.72rem; font-weight: 800; color: var(--text-main);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* Compact Button Bar */
    .action-buttons-row {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    .btn-throw-meh {
      background: linear-gradient(135deg, #f59e0b, #ec4899);
      color: #ffffff; border: none; padding: 9px 18px; border-radius: 9999px;
      font-size: 0.78rem; font-weight: 800; cursor: pointer; display: inline-flex;
      align-items: center; gap: 6px; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
      transition: transform 0.15s ease, filter 0.15s ease;
      white-space: nowrap;
    }
    .btn-throw-meh:hover { transform: scale(1.03); filter: brightness(1.1); }

    .btn-reset {
      background: var(--surface-subtle);
      color: var(--text-muted); border: 1px solid var(--border); padding: 9px 16px; border-radius: 9999px;
      font-size: 0.78rem; font-weight: 800; cursor: pointer; display: inline-flex;
      align-items: center; gap: 6px; transition: 0.15s ease; white-space: nowrap;
    }
    .btn-reset:hover { background: var(--border); color: var(--text-main); }

    .placeholder-banner {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 24px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 700;
      width: 100%;
    }

    /* Disclaimer in fine print */
    .site-disclaimer {
      text-align: center;
      font-size: 0.65rem;
      color: var(--text-muted);
      line-height: 1.4;
      padding: 10px 16px;
      max-width: 600px;
      margin: 0 auto;
      opacity: 0.8;
    }

    /* Modal for Synopsis & Actions */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); z-index: 200; display: none;
      align-items: flex-end; justify-content: center; padding: 0; backdrop-filter: blur(6px);
    }
    @media (min-width: 600px) { .modal-backdrop { align-items: center; padding: 16px; } }
    .modal-backdrop.active { display: flex; }
    .modal-content {
      background: var(--surface); border-radius: 24px 24px 0 0; padding: 20px; width: 100%; max-width: 500px;
      box-shadow: var(--shadow-xl); max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (min-width: 600px) { .modal-content { border-radius: 24px; } }
    @keyframes slideUp { 0% { transform: translateY(100%); } 100% { transform: translateY(0); } }
    .modal-header { display: flex; align-items: center; justify-content: space-between; }
    .modal-top-row { display: flex; gap: 14px; align-items: flex-start; }
    .modal-poster { width: 110px; aspect-ratio: 2 / 3; border-radius: 12px; object-fit: cover; background: #000; flex-shrink: 0; }
    .modal-info-col { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .modal-title { font-size: 1.05rem; font-weight: 800; color: var(--text-main); line-height: 1.25; }
    .modal-meta { font-size: 0.74rem; font-weight: 700; color: var(--primary); }
    .modal-overview { font-size: 0.82rem; color: var(--text-muted); line-height: 1.45; max-height: 140px; overflow-y: auto; }
    
    .modal-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 2px; }
    .modal-btn {
      padding: 11px 14px; border-radius: 9999px; font-weight: 800; font-size: 0.8rem; cursor: pointer; border: none;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
    }
    .btn-trailer { background: var(--surface-subtle); color: var(--text-main); border: 1px solid var(--border); }
    .btn-watch-bwhs { background: var(--primary); color: #ffffff; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }

    .btn-circle {
      width: 34px; height: 34px; border-radius: 50%; background: var(--surface-subtle);
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
      color: var(--text-main); cursor: pointer;
    }

    /* Trailer Popup Modal */
    .trailer-modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 250; display: none; align-items: center; justify-content: center; padding: 12px;
    }
    .trailer-modal-backdrop.active { display: flex; }
    .trailer-modal-box { width: 100%; max-width: 640px; background: #000; border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
    .trailer-viewport { position: relative; width: 100%; aspect-ratio: 16 / 9; }
    .trailer-viewport iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }

    .loading-spinner { text-align: center; padding: 20px; color: var(--primary); font-size: 1.3rem; display: none; width: 100%; }
    .loading-spinner.active { display: block; }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="#" class="brand-logo">
        <img src="https://github.com/HumbleKidd/BWHS/blob/main/Gemini_Generated_Image_kg21fkkg21fkkg21__1_-removebg-preview.png?raw=true" alt="BWHS Logo" />
        <div>
          <div class="brand-title">BWHS</div>
          <div class="brand-subtitle">Binge Watch Humble Streams</div>
        </div>
      </a>
      <div class="header-tagline">What To Watch?! 🍿</div>
    </div>
  </header>

  <main>
    <!-- Control Suite -->
    <section class="control-panel">
      <div class="filters-row">
        <div class="filter-group">
          <label>Category / Type</label>
          <select id="filterType" onchange="resetSelection()">
            <option value="movie">Movies</option>
            <option value="tv">TV Shows</option>
            <option value="cartoon">Cartoons</option>
            <option value="anime">Anime</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Year Range</label>
          <select id="filterYear" onchange="resetSelection()">
            <option value="random">Random (2000 - 2026)</option>
            <option value="2026">2026</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <option value="2020-2022">2020 - 2022</option>
            <option value="2010-2019">2010 - 2019</option>
            <option value="2000-2009">2000 - 2009</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Results Section -->
    <section class="results-container">
      <div class="placeholder-banner" id="placeholderBanner">
        Tap the button below to reveal 3 random picks!
      </div>
      <div class="media-grid" id="mediaGrid"></div>
      <div class="loading-spinner" id="loadingSpinner"><i class="fa-solid fa-circle-notch fa-spin"></i></div>

      <!-- Action Buttons Row -->
      <div class="action-buttons-row">
        <button type="button" class="btn-throw-meh" onclick="triggerThrowMeh()">
          <i class="fa-solid fa-dice"></i> Throw Meh ' (3 Picks)
        </button>
        <button type="button" class="btn-reset" onclick="resetSelection()">
          <i class="fa-solid fa-rotate-left"></i> Reset
        </button>
      </div>
    </section>
  </main>

  <!-- Fine Print Disclaimer -->
  <footer class="site-disclaimer">
    Disclaimer: This site does not host any files on its servers. All contents are provided by non-affiliated third parties.
  </footer>

  <!-- Synopsis & Action Modal -->
  <div class="modal-backdrop" id="infoModalBackdrop" onclick="closeInfoModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div id="modalCategoryBadge" style="font-size:0.68rem; font-weight:800; color:var(--accent); text-transform:uppercase;"></div>
        <button class="btn-circle" onclick="closeInfoModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-top-row">
        <img id="modalPoster" class="modal-poster" src="" alt="" />
        <div class="modal-info-col">
          <h3 id="modalTitle" class="modal-title"></h3>
          <div id="modalMeta" class="modal-meta"></div>
          <p id="modalOverview" class="modal-overview"></p>
        </div>
      </div>
      <div class="modal-buttons">
        <button type="button" class="modal-btn btn-trailer" id="modalTrailerBtn">
          <i class="fa-solid fa-clapperboard"></i> Trailer
        </button>
        <a href="#" class="modal-btn btn-watch-bwhs" id="modalWatchBtn" target="_blank">
          <i class="fa-solid fa-play"></i> Watch BWHS
        </a>
      </div>
    </div>
  </div>

  <!-- Trailer Popup Modal -->
  <div class="trailer-modal-backdrop" id="trailerModalBackdrop" onclick="closeTrailerModal(event)">
    <div class="trailer-modal-box" onclick="event.stopPropagation()">
      <div class="trailer-viewport">
        <iframe id="trailerIframe" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      </div>
      <div style="padding: 10px 14px; display: flex; justify-content: flex-end; background:#121216;">
        <button type="button" class="modal-btn btn-trailer" onclick="closeTrailerModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    const TMDB_API_KEY = '129637a8869a61522af21b80f6eb5129';
    const TMDB_BASE = 'https://api.themoviedb.org/3';
    const IMAGE_BASE = 'https://image.tmdb.org/t/p/w342';
    
    let seenItemIds = new Set();
    let globalFetchedPool = [];

    function resetSelection() {
      document.getElementById('mediaGrid').innerHTML = '';
      document.getElementById('placeholderBanner').style.display = 'block';
      seenItemIds.clear();
      globalFetchedPool = [];
    }

    async function triggerThrowMeh() {
      const typeSelect = document.getElementById('filterType').value;
      const yearSetting = document.getElementById('filterYear').value;
      const grid = document.getElementById('mediaGrid');
      const spinner = document.getElementById('loadingSpinner');
      const placeholder = document.getElementById('placeholderBanner');

      placeholder.style.display = 'none';
      grid.innerHTML = '';
      spinner.classList.add('active');

      try {
        if (globalFetchedPool.length === 0) {
          let apiMediaType = 'movie';
          let extraParams = '';

          if (typeSelect === 'tv') {
            apiMediaType = 'tv';
          } else if (typeSelect === 'cartoon') {
            apiMediaType = 'movie';
            extraParams = '&with_genres=16';
          } else if (typeSelect === 'anime') {
            apiMediaType = 'tv';
            extraParams = '&with_original_language=ja&with_genres=16';
          }

          const pages = [1, 2, 3, 4, 5, 6, 7, 8];
          const promises = pages.map(async page => {
            let endpoint = `${TMDB_BASE}/discover/${apiMediaType}?api_key=${TMDB_API_KEY}&page=${page}&sort_by=popularity.desc${extraParams}`;
            
            if (yearSetting !== 'random') {
              if (yearSetting.includes('-')) {
                const [startYear, endYear] = yearSetting.split('-');
                endpoint += apiMediaType === 'movie' 
                  ? `&primary_release_date.gte=${startYear}-01-01&primary_release_date.lte=${endYear}-12-31`
                  : `&first_air_date.gte=${startYear}-01-01&first_air_date.lte=${endYear}-12-31`;
              } else {
                endpoint += apiMediaType === 'movie'
                  ? `&primary_release_date.gte=${yearSetting}-01-01&primary_release_date.lte=${yearSetting}-12-31`
                  : `&first_air_date.gte=${yearSetting}-01-01&first_air_date.lte=${yearSetting}-12-31`;
              }
            } else {
              endpoint += apiMediaType === 'movie'
                ? `&primary_release_date.gte=2000-01-01&primary_release_date.lte=2026-12-31`
                : `&first_air_date.gte=2000-01-01&first_air_date.lte=2026-12-31`;
            }

            const res = await fetch(endpoint);
            const data = await res.json();
            return data.results || [];
          });

          const responses = await Promise.all(promises);
          let rawList = [];
          responses.forEach(list => rawList.push(...list));

          const seen = new Set();
          globalFetchedPool = rawList.filter(item => {
            if (!item.poster_path) return false;
            if (seen.has(item.id)) return false;
            seen.add(item.id);
            return true;
          });
        }

        let freshPool = globalFetchedPool.filter(i => !seenItemIds.has(i.id));
        if (freshPool.length < 3) {
          seenItemIds.clear();
          freshPool = globalFetchedPool;
        }

        freshPool.sort(() => Math.random() - 0.5);
        const picked3 = freshPool.slice(0, 3);
        picked3.forEach(i => seenItemIds.add(i.id));

        await Promise.all(picked3.map(item => {
          return new Promise((resolve) => {
            const img = new Image();
            img.src = `${IMAGE_BASE}${item.poster_path}`;
            img.onload = resolve;
            img.onerror = resolve;
          });
        }));

        spinner.classList.remove('active');
        renderMediaGrid(picked3, typeSelect);
      } catch (err) {
        spinner.classList.remove('active');
        grid.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1; text-align: center;">Failed to fetch recommendations.</p>';
      }
    }

    function renderMediaGrid(items, type) {
      const grid = document.getElementById('mediaGrid');
      grid.innerHTML = '';

      if (!items || items.length === 0) {
        grid.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1; text-align: center; padding: 20px;">No titles found. Try another filter!</p>';
        return;
      }

      items.forEach(item => {
        const title = item.title || item.name || 'Untitled';
        const dateStr = item.release_date || item.first_air_date || '2026';
        const year = dateStr.split('-')[0];
        const rating = item.vote_average ? item.vote_average.toFixed(1) : '8.0';

        const card = document.createElement('div');
        card.className = 'media-card';
        card.innerHTML = `
          <div class="poster-wrap">
            <img src="${IMAGE_BASE}${item.poster_path}" alt="${title}" />
            <span class="badge-pill year">${year}</span>
            <span class="badge-pill rating"><i class="fa-solid fa-star"></i> ${rating}</span>
          </div>
          <div class="card-body">
            <div class="card-title">${title}</div>
          </div>
        `;
        card.onclick = () => openInfoModal(item, type, year, rating);
        grid.appendChild(card);
      });
    }

    function openInfoModal(item, type, year, rating) {
      const backdrop = document.getElementById('infoModalBackdrop');
      document.getElementById('modalCategoryBadge').textContent = `${type.toUpperCase()} · ${year}`;
      document.getElementById('modalPoster').src = item.poster_path ? `${IMAGE_BASE}${item.poster_path}` : '';
      document.getElementById('modalTitle').textContent = item.title || item.name || 'Untitled';
      document.getElementById('modalMeta').textContent = `Rating: ${rating} / 10`;
      document.getElementById('modalOverview').textContent = item.overview || 'No synopsis available for this title.';

      const trailerBtn = document.getElementById('modalTrailerBtn');
      trailerBtn.onclick = () => fetchAndPlayTrailer(item.id, type === 'tv' || type === 'anime' ? 'tv' : 'movie');

      const watchBtn = document.getElementById('modalWatchBtn');
      if (type === 'tv' || type === 'anime') {
        watchBtn.href = `https://bwhs.online/#/watch/tv/${item.id}/1/1`;
      } else {
        watchBtn.href = `https://bwhs.online/#/watch/movie/${item.id}`;
      }

      backdrop.classList.add('active');
    }

    function closeInfoModal(e) {
      if (!e || e.target.id === 'infoModalBackdrop' || e.target.closest('.btn-circle')) {
        document.getElementById('infoModalBackdrop').classList.remove('active');
      }
    }

    async function fetchAndPlayTrailer(id, mediaType) {
      try {
        const res = await fetch(`${TMDB_BASE}/${mediaType}/${id}/videos?api_key=${TMDB_API_KEY}`);
        const data = await res.json();
        const trailer = (data.results || []).find(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser'));
        if (trailer && trailer.key) {
          document.getElementById('trailerIframe').src = `https://www.youtube.com/embed/${trailer.key}?autoplay=1`;
          document.getElementById('trailerModalBackdrop').classList.add('active');
        } else {
          alert('No official trailer found for this title.');
        }
      } catch (err) {
        alert('Could not load trailer.');
      }
    }

    function closeTrailerModal(e) {
      if (!e || e.target.id === 'trailerModalBackdrop' || e.target.classList.contains('modal-btn')) {
        document.getElementById('trailerIframe').src = '';
        document.getElementById('trailerModalBackdrop').classList.remove('active');
      }
    }
  </script>
</body>
</html>
